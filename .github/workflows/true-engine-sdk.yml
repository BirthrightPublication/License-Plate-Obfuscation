name: True Engine SDK consumer compatibility (not application integration)
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-consumer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install Linux offscreen graphics drivers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libgl1-mesa-dri mesa-vulkan-drivers
      - name: Install the SDK-declared Rust toolchain
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Run external CPU and actual engine GPU pixel tests
        working-directory: integration/true-engine-sdk-probe
        shell: bash
        env:
          EGL_PLATFORM: surfaceless
          CARGO_BUILD_JOBS: '4'
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            export XDG_RUNTIME_DIR="$RUNNER_TEMP/plate-sdk-runtime"
            export MESA_SHADER_CACHE_DIR="$RUNNER_TEMP/plate-mesa-cache"
            mkdir -p "$XDG_RUNTIME_DIR" "$MESA_SHADER_CACHE_DIR"
            chmod 700 "$XDG_RUNTIME_DIR"
          fi
          cargo +1.85.1 test --locked -- --nocapture 2>&1 | tee sdk-test-results.txt
      - name: Record adapter and actual test counts
        working-directory: integration/true-engine-sdk-probe
        shell: python
        run: |
          from pathlib import Path
          output = '\n'.join(line for line in Path('sdk-test-results.txt').read_text(errors='replace').splitlines()
                             if 'test result:' in line or 'True Engine probe adapter:' in line)
          output = output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::notice title=SDK consumer results::' + output, flush=True)
      - name: Expose actual failure evidence without requiring authenticated logs
        if: failure()
        working-directory: integration/true-engine-sdk-probe
        shell: python
        run: |
          from pathlib import Path
          report = Path('sdk-test-results.txt')
          if report.exists():
              output = '\n'.join(report.read_text(errors='replace').splitlines()[-100:])
              output = output.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              print('::error title=SDK consumer failure details::' + output, flush=True)
      # GPU adapter absence is a failed qualification, never an automatic skip.
      # This job does not publish an application, SDK, or binary release.
