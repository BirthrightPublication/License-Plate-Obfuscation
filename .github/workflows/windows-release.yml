name: Windows tests and complete release
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Preserve checksum-relevant source line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/domain.test.js
      - run: python tools/run_tests_ci.py
  windows-package:
    needs: tests
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify stable tag matches source version
        shell: python
        run: |
          import json, os, re
          version = json.load(open('package.json'))['version']
          assert re.fullmatch(r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)', version)
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              assert os.environ['GITHUB_REF_NAME'] == 'v' + version
      - run: python -m pip install -r tools/requirements-windows-build.txt
      - name: Build self-contained runtime and updater
        run: python tools/windows_release.py --output Build
      - name: Install browser testing tools outside source
        shell: pwsh
        run: |
          npm install --prefix "$env:RUNNER_TEMP/plate-browser" playwright@1.62.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node "$env:RUNNER_TEMP/plate-browser/node_modules/playwright/cli.js" install chromium
      - name: Test actual Windows installation, executable, browser, recovery and data preservation
        shell: pwsh
        run: |
          $env:NODE_PATH = "$env:RUNNER_TEMP/plate-browser/node_modules"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          python tools/test_windows_release.py "Build/License-Plate-Studio-v$version-windows-x64.zip" --browser 2>&1 | Tee-Object -FilePath Build/windows-test-report.txt
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64-installation
          path: |
            Build/License-Plate-Studio-v*-windows-x64.zip
            Build/License-Plate-Studio-v*-windows-x64.zip.sha256
            Build/windows-test-report.txt
          if-no-files-found: error
  publish:
    needs: windows-package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows-x64-installation
          path: release-assets
      - name: Prepare exact release evidence
        shell: bash
        run: |
          python tools/release_notes.py > release-notes.md
          cd release-assets
          sha256sum -c *.sha256
      - name: Publish only after both installation assets and test evidence are uploaded and re-downloaded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          gh release create "$tag" release-assets/* --draft --verify-tag --title "License Plate Studio $tag" --notes-file release-notes.md
          mkdir verify-download
          gh release download "$tag" --dir verify-download
          cd verify-download
          sha256sum -c *.sha256
          cd ..
          gh release edit "$tag" --draft=false --prerelease=false --latest
